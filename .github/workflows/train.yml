name: OpenWrt eBPF & Rust aarch64-musl CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev linux-tools-generic linux-headers-generic

      - name: Install Cross tool
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Ensure headers and Compile eBPF
        run: |
          if [ ! -f "vmlinux.h" ] && [ ! -f "bpf/vmlinux.h" ]; then
            echo "[*] Generating vmlinux.h via bpftool..."
            sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > vmlinux.h 2>/dev/null || true
          fi

          BPF_SRC=$(find . -name "filter.bpf.c" | head -n 1)
          BPF_DIR=$(dirname "$BPF_SRC")
          echo "Found BPF source at: $BPF_SRC"

          clang -O2 -target bpf \
            -D__TARGET_ARCH_arm64 \
            -I . \
            -I "$BPF_DIR" \
            -I /usr/include \
            -I /usr/include/bpf \
            -I /usr/include/aarch64-linux-gnu \
            -c "$BPF_SRC" -o filter.bpf.o

          ls -lh filter.bpf.o

      - name: Build vexond binary via Cross
        run: |
          cross build --release --target aarch64-unknown-linux-musl

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release_dist
          cp target/aarch64-unknown-linux-musl/release/vexond release_dist/vexond
          cp filter.bpf.o release_dist/filter.bpf.o
          
          if [ -f "model.bin" ]; then 
            cp model.bin release_dist/
          else 
            head -c 1308 /dev/zero > release_dist/model.bin
          fi

          if [ -f "mlqos.nft" ]; then 
            cp mlqos.nft release_dist/
          elif [ -f "src/mlqos.nft" ]; then 
            cp src/mlqos.nft release_dist/
          fi

          cd release_dist
          sha256sum vexond > SHA256SUMS
          sha256sum filter.bpf.o >> SHA256SUMS
          [ -f "model.bin" ] && sha256sum model.bin >> SHA256SUMS
          [ -f "mlqos.nft" ] && sha256sum mlqos.nft >> SHA256SUMS
          
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vexon Latest Build"
          prerelease: false
          files: |
            release_dist/vexond
            release_dist/filter.bpf.o
            release_dist/model.bin
            release_dist/mlqos.nft
            release_dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
