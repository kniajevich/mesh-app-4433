name: Train & Release INT8 QoS Model

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML Dependencies
        run: |
          pip install --upgrade pip
          pip install torch numpy --index-url https://download.pytorch.org/whl/cpu

      - name: Train and Export INT8 Model
        run: python train/train.py

      - name: Publish Trained Model to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Autonomous INT8 Model Weights"
          body: "Daily retrained INT8 weights optimized for gaming, voice and low-latency QoS."
          files: |
            model.bin
            model.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
