name: Train & Release INT8 QoS Model

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install numpy

      - name: Run Model Export
        run: python train/train.py

      - name: Publish Latest Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Autonomous INT8 Model Weights"
          body: "Autogenerated daily weights for vexond."
          files: |
            model.bin
            model.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
