name: OpenWrt eBPF & Rust aarch64-musl CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev gcc-aarch64-linux-gnu musl-tools

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Compile eBPF kernel program (Clang)
        run: |
          BPF_SRC=""
          if [ -f "filter.bpf.c" ]; then
            BPF_SRC="filter.bpf.c"
          elif [ -f "src/filter.bpf.c" ]; then
            BPF_SRC="src/filter.bpf.c"
          elif [ -f "bpf/filter.bpf.c" ]; then
            BPF_SRC="bpf/filter.bpf.c"
          else
            BPF_SRC=$(find . -name "filter.bpf.c" | head -n 1)
          fi
          
          echo "Found BPF source at: $BPF_SRC"
          clang -O2 -target bpf -c "$BPF_SRC" -o filter.bpf.o
          ls -lh filter.bpf.o

      - name: Build vexond binary (musl static)
        run: |
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release_dist
          cp target/aarch64-unknown-linux-musl/release/vexond release_dist/vexond
          cp filter.bpf.o release_dist/filter.bpf.o
          
          # Копируем model.bin и mlqos.nft, если есть, иначе генерируем
          if [ -f "model.bin" ]; then cp model.bin release_dist/; else head -c 1308 /dev/zero > release_dist/model.bin; fi
          if [ -f "mlqos.nft" ]; then cp mlqos.nft release_dist/; elif [ -f "src/mlqos.nft" ]; then cp src/mlqos.nft release_dist/; fi

          cd release_dist
          sha256sum vexond > SHA256SUMS
          sha256sum filter.bpf.o >> SHA256SUMS
          [ -f "model.bin" ] && sha256sum model.bin >> SHA256SUMS
          [ -f "mlqos.nft" ] && sha256sum mlqos.nft >> SHA256SUMS
          
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish to latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Vexon Latest Build"
          prerelease: false
          files: |
            release_dist/vexond
            release_dist/filter.bpf.o
            release_dist/model.bin
            release_dist/mlqos.nft
            release_dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
