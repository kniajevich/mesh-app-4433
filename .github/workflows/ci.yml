name: OpenWrt eBPF & Rust aarch64 musl CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain, bpftool and libbpf
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev bpftool gcc-aarch64-linux-gnu musl-tools

      - name: Generate vmlinux.h from Host BTF
        run: |
          if [ -f /sys/kernel/btf/vmlinux ]; then
            bpftool btf dump file /sys/kernel/btf/vmlinux format c > ebpf/vmlinux.h
          else
            echo -e "#ifndef __VMLINUX_H__\n#define __VMLINUX_H__\ntypedef unsigned char __u8;\ntypedef unsigned short __u16;\ntypedef unsigned int __u32;\ntypedef unsigned long long __u64;\n#endif" > ebpf/vmlinux.h
          fi

      - name: Compile eBPF Bytecode
        run: |
          clang -g -O2 -target bpf -D__TARGET_ARCH_arm64 \
            -Iebpf \
            -I/usr/include \
            -I/usr/include/$(uname -m)-linux-gnu \
            -c ebpf/filter.bpf.c -o ebpf/filter.bpf.o

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build smart-qosd binary (musl static)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/smart-qosd ./smart-qosd

      - name: Attach binaries to latest release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: |
            smart-qosd
            ebpf/filter.bpf.o
            rules/mlqos.nft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
